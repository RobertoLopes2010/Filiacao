<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#008082" />
    <meta
      name="description"
      content="Proposta de Filiação ABRAMUS — Pessoa Física. Preenchimento, conferência e exportação 100% no dispositivo."
    />
    <title>Proposta de Filiação — ABRAMUS</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="icons/icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Filiação" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar__inner">
        <div class="brand">
          <img
            class="app-bar__logo"
            src="icons/abramus-marca-branca.png"
            alt="ABRAMUS — direito autoral levado a sério"
            width="480"
            height="240"
          />
          <div class="brand__txt">
            <strong>Proposta de Filiação</strong>
            <span><em class="brand__org">ABRAMUS</em> · Pessoa Física</span>
          </div>
        </div>
        <div class="app-bar__actions">
          <button
            id="btnSair"
            class="icon-btn"
            type="button"
            aria-label="Fechar o Aplicativo"
            title="Fechar o Aplicativo"
          >
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path
                d="M14.5 3H6.5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1Z"
                stroke="currentColor"
                stroke-width="1.8"
                fill="none"
                stroke-linejoin="round"
              />
              <circle cx="12.6" cy="12" r="1.15" fill="currentColor" />
              <path
                d="M18.5 21h2"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="btnMenu"
            class="icon-btn"
            type="button"
            aria-label="Mais opções"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" width="22" height="22">
              <circle cx="12" cy="5" r="2" fill="currentColor" />
              <circle cx="12" cy="12" r="2" fill="currentColor" />
              <circle cx="12" cy="19" r="2" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
      <div
        class="progress"
        role="progressbar"
        aria-label="Preenchimento dos campos obrigatórios"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progressBar" class="progress__bar" style="width: 0%"></div>
      </div>
      <nav id="stepper" class="stepper" aria-label="Etapas do formulário"></nav>
    </header>

    <main id="main" class="main">
      <div id="steps"></div>
    </main>

    <div id="pendingSheet" class="sheet" hidden>
      <div class="sheet__backdrop" data-close-sheet></div>
      <div
        class="sheet__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pendTitle"
      >
        <div class="sheet__grip"></div>
        <div class="sheet__head">
          <h2 id="pendTitle">Pendências obrigatórias</h2>
          <button
            class="icon-btn"
            type="button"
            data-close-sheet
            aria-label="Fechar"
          >
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path
                d="M6 6l12 12M18 6 6 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div id="pendingList" class="sheet__body"></div>
      </div>
    </div>

    <div id="menuSheet" class="sheet" hidden>
      <div class="sheet__backdrop" data-close-sheet></div>
      <div
        class="sheet__panel"
        role="dialog"
        aria-modal="true"
        aria-label="Opções"
      >
        <div class="sheet__grip"></div>
        <div class="sheet__body">
          <button class="menu-item" type="button" id="miInstall">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Instalar aplicativo
          </button>
          <button class="menu-item" type="button" id="miDemo">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M4 6h16M4 12h16M4 18h10"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Preencher com dados de exemplo
          </button>
          <button
            class="menu-item menu-item--danger"
            type="button"
            id="miClear"
          >
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M5 7h14M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Limpar formulário
          </button>
          <button class="menu-item" type="button" id="miSair" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M15 17l5-5-5-5M20 12H9M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Sair do aplicativo
          </button>
          <p class="menu-note">
            Nenhum dado sai deste aparelho. Tudo é processado e armazenado
            localmente.
          </p>
        </div>
      </div>
    </div>

    <!-- Diálogo próprio em vez do confirm() do navegador: o nativo é rotulado
         com "Esta página diz…" e a origem, o que numa PWA/APK não faz sentido. -->
    <div id="confirmSheet" class="sheet sheet--canto" hidden>
      <div class="sheet__backdrop" data-close-sheet></div>
      <div
        class="sheet__panel"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirmTitle"
      >
        <div class="sheet__grip"></div>
        <div class="sheet__head">
          <h2 id="confirmTitle">Deseja fechar o aplicativo?</h2>
        </div>
        <div class="sheet__body">
          <p class="aviso-perda">
            Todas as informações preenchidas serão perdidas
          </p>
          <div class="confirm-acoes">
            <button class="btn btn--ghost" type="button" data-close-sheet>
              Cancelar
            </button>
            <button id="confirmSim" class="btn btn--primary" type="button">
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer class="bottom-bar">
      <button id="btnPending" class="pending-btn" type="button">
        <span id="pendingCount" class="pending-btn__badge">0</span>
        <span id="pendingLabel">pendências</span>
      </button>
      <div class="bottom-bar__nav">
        <button id="btnPrev" class="btn btn--ghost" type="button">
          Voltar
        </button>
        <button id="btnNext" class="btn btn--primary" type="button">
          Avançar
        </button>
      </div>
    </footer>

    <div id="toast" class="toast" hidden></div>
    <div id="busy" class="busy" hidden>
      <div class="busy__box">
        <div class="spinner"></div>
        <span id="busyText">Gerando…</span>
      </div>
    </div>

    <script src="js/schema.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
